<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101720"><title>Sign in — Markets</title>
<link rel="stylesheet" href="/static/css/app.css"><link rel="stylesheet" href="/static/css/login.css">
</head>
<body data-theme="dark" data-style="hybrid" data-density="balanced" data-accent="mint" class="login-page">
<main class="login-shell">
<section class="login-brand"><div class="brand-mark">M</div><div><b>markets</b><small>YOUR PERSONAL MARKET DESK</small></div></section>
<section class="login-card"><div class="eyebrow" id="login-eyebrow">WELCOME BACK</div><h1 id="login-title">Sign in to Markets</h1>
<p id="login-description">Your watchlists and market overview, all in one place.</p>
<form id="login-form">
<label>Username<input id="username" name="username" autocomplete="username" autocapitalize="none" minlength="2" maxlength="32" required autofocus></label>
<label>Password<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required></label>
<div id="login-error" class="login-error" role="alert"></div>
<button id="login-submit" class="primary-button" type="submit">Sign in <span>→</span></button>
</form><div class="login-foot">Market data provided by Yahoo Finance · Quotes may be delayed</div></section>
</main><script type="module" src="/static/js/login.js"></script>
</body></html>
